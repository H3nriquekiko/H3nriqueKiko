version: "3.9"
services:
  db:
    image: postgres:16
    container_name: checklist-db
    environment:
      POSTGRES_DB: checklist
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: checklist
    ports:
      - "5432:5432"
    volumes:
      - checklist_db:/var/lib/postgresql/data
volumes:
  checklist_db:
